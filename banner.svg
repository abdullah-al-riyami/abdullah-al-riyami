<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Hi, I'm Abdullah. Whatever comes to mind ends up here.">
  <defs>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#1f6feb" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fb950" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#161b22" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="318" rx="16"/></clipPath>
  </defs>

  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .bar { fill: url(#barGrad); transform-box: fill-box; transform-origin: 50% 100%; animation: grow 3.2s ease-in-out infinite; }
    .b1 { animation-delay: -0.0s; } .b2 { animation-delay: -0.4s; } .b3 { animation-delay: -0.8s; }
    .b4 { animation-delay: -1.2s; } .b5 { animation-delay: -1.6s; } .b6 { animation-delay: -2.0s; }
    .b7 { animation-delay: -2.4s; }
    @keyframes grow { 0%, 100% { transform: scaleY(0.35); } 50% { transform: scaleY(1); } }

    .line { fill: none; stroke: #3fb950; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
            stroke-dasharray: 1; animation: draw 6s ease-in-out infinite; }
    @keyframes draw { 0% { stroke-dashoffset: 1; opacity: 1; } 55% { stroke-dashoffset: 0; opacity: 1; }
                      88% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
    .area { fill: url(#areaGrad); animation: fadeArea 6s ease-in-out infinite; }
    @keyframes fadeArea { 0%, 40% { opacity: 0; } 60%, 88% { opacity: 1; } 100% { opacity: 0; } }
    .pt { fill: #0d1117; stroke: #3fb950; stroke-width: 2; animation: pop 6s ease-in-out infinite; }
    .p1 { animation-delay: 0.3s; } .p2 { animation-delay: 0.8s; } .p3 { animation-delay: 1.3s; }
    .p4 { animation-delay: 1.8s; } .p5 { animation-delay: 2.3s; }
    @keyframes pop { 0%, 8% { opacity: 0; } 16%, 80% { opacity: 1; } 95%, 100% { opacity: 0; } }

    .cursor { fill: #58a6ff; animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }

    .node { fill: #0d1117; stroke: #58a6ff; stroke-width: 2; animation: pulse 4s ease-in-out infinite; }
    .n2 { animation-delay: 1.33s; } .n3 { animation-delay: 2.66s; } .n4 { animation-delay: 4s; }
    @keyframes pulse { 0%, 20%, 100% { stroke: #58a6ff; } 8% { stroke: #f0f6fc; } }

    @media (prefers-reduced-motion: reduce) {
      .bar, .line, .area, .pt, .cursor, .node { animation: none; }
    }
  </style>

  <!-- background -->
  <rect x="1" y="1" width="1198" height="318" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="318" fill="url(#grid)" clip-path="url(#frame)"/>

  <!-- bar chart -->
  <line x1="60" y1="215" x2="300" y2="215" stroke="#30363d" stroke-width="2"/>
  <rect class="bar b1" x="70"  y="155" width="22" height="60"  rx="3"/>
  <rect class="bar b2" x="102" y="115" width="22" height="100" rx="3"/>
  <rect class="bar b3" x="134" y="135" width="22" height="80"  rx="3"/>
  <rect class="bar b4" x="166" y="85"  width="22" height="130" rx="3"/>
  <rect class="bar b5" x="198" y="120" width="22" height="95"  rx="3"/>
  <rect class="bar b6" x="230" y="65"  width="22" height="150" rx="3"/>
  <rect class="bar b7" x="262" y="100" width="22" height="115" rx="3"/>

  <!-- title -->
  <text x="600" y="92" text-anchor="middle" font-size="16" fill="#58a6ff">SELECT * FROM ideas;</text>
  <text x="600" y="150" text-anchor="middle" font-size="48" font-weight="700" fill="#f0f6fc">Hi, I'm Abdullah</text>
  <text x="600" y="192" text-anchor="middle" font-size="18" fill="#8b949e">Whatever comes to mind ends up here</text>
  <rect class="cursor" x="797" y="177" width="10" height="19"/>

  <!-- line chart -->
  <path d="M900 65V215H1140" fill="none" stroke="#30363d" stroke-width="2"/>
  <path class="area" d="M910 200L950 172L990 184L1030 140L1070 150L1100 108L1130 82V215H910Z"/>
  <path class="line" pathLength="1" d="M910 200L950 172L990 184L1030 140L1070 150L1100 108L1130 82"/>
  <circle class="pt p1" cx="950"  cy="172" r="4"/>
  <circle class="pt p2" cx="990"  cy="184" r="4"/>
  <circle class="pt p3" cx="1030" cy="140" r="4"/>
  <circle class="pt p4" cx="1070" cy="150" r="4"/>
  <circle class="pt p5" cx="1100" cy="108" r="4"/>

  <!-- pipeline -->
  <line x1="70" y1="262" x2="1130" y2="262" stroke="#30363d" stroke-width="2" stroke-dasharray="4 6"/>
  <g>
    <circle r="4" fill="#58a6ff"><animateMotion dur="5s" begin="0s"  repeatCount="indefinite" path="M70 262H1130"/></circle>
    <circle r="3" fill="#3fb950"><animateMotion dur="5s" begin="-1s" repeatCount="indefinite" path="M70 262H1130"/></circle>
    <circle r="4" fill="#d29922"><animateMotion dur="5s" begin="-2s" repeatCount="indefinite" path="M70 262H1130"/></circle>
    <circle r="3" fill="#58a6ff"><animateMotion dur="5s" begin="-3s" repeatCount="indefinite" path="M70 262H1130"/></circle>
    <circle r="4" fill="#3fb950"><animateMotion dur="5s" begin="-4s" repeatCount="indefinite" path="M70 262H1130"/></circle>
  </g>
  <circle class="node n1" cx="70"   cy="262" r="8"/>
  <circle class="node n2" cx="423"  cy="262" r="8"/>
  <circle class="node n3" cx="777"  cy="262" r="8"/>
  <circle class="node n4" cx="1130" cy="262" r="8"/>
  <text x="70"   y="294" text-anchor="start"  font-size="14" fill="#8b949e">raw</text>
  <text x="423"  y="294" text-anchor="middle" font-size="14" fill="#8b949e">clean</text>
  <text x="777"  y="294" text-anchor="middle" font-size="14" fill="#8b949e">model</text>
  <text x="1130" y="294" text-anchor="end"    font-size="14" fill="#8b949e">insight</text>
</svg>
